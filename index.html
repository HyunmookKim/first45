<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>First45 운용 · 선내 적재표</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* 잠금(읽기전용) 모드: 수정 관련 UI 전부 숨김 */
body.locked .pform{display:none}
body.locked .pm, body.locked .pe, body.locked .pd, body.locked .pg{display:none}
body.locked .trestore, body.locked .tdelp{display:none}
body.locked #restoreBtn{display:none}
#lockBtn.unlocked{border-color:#3a8a5a;color:#7aefaa}
body{background:#0a1628;color:#e8eef5;font-family:'Segoe UI','Apple SD Gothic Neo',sans-serif;min-height:100vh}
header{border-bottom:1px solid #1e3a5a;background:#081020;position:sticky;top:0;z-index:20}
.hrow{padding:10px 16px 6px;display:flex;align-items:center;justify-content:space-between}
.sub{font-size:10px;letter-spacing:2px;color:#4a8ab5;text-transform:uppercase}
h1{font-size:17px;font-weight:700;color:#c8dff0}
.btns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.tab{background:transparent;border:1px solid #2a5a8a;border-radius:6px;color:#8ac0e8;padding:7px 10px;font-size:12px;cursor:pointer}
#searchWrap{position:relative;padding:0 16px 9px}
#searchInput{width:100%;background:#0c1e30;border:1px solid #1e4060;border-radius:7px;color:#c8dff0;padding:8px 11px;font-size:13px;outline:none}
#searchResults{position:absolute;left:16px;right:16px;top:100%;margin-top:-5px;background:#0c1e30;border:1px solid #2a5a8a;border-radius:8px;max-height:55vh;overflow:auto;display:none;z-index:40;box-shadow:0 10px 30px #000a}
.sr{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid #14283a;cursor:pointer}
.sr:last-child{border-bottom:none}
.sr:active{background:#14304a}
.sr img{width:34px;height:34px;object-fit:cover;border-radius:4px;border:1px solid #2a5a8a;flex-shrink:0}
.sr .sn{font-size:13px;color:#c8dff0;font-weight:600}
.sr .sp{font-size:11px;color:#5a9ac0;margin-top:1px}
.sr .sq{margin-left:auto;font-size:12px;color:#7aefaa;white-space:nowrap}
.srnone{padding:11px;font-size:12px;color:#3a5a7a;text-align:center}
#mapWrap{padding:14px;display:flex;justify-content:center}
#map{position:relative;width:min(420px,100%)}
#map img{display:block;width:100%;height:auto;filter:brightness(1.1);opacity:.82;pointer-events:none}
.box{position:absolute;border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:all .12s}
.box span{font-size:6.4px;text-align:center;line-height:1;padding:1px;text-shadow:0 1px 3px #000;white-space:nowrap}
.b-n{border:1.5px solid #2a5a8a88;background:#0a204033}.b-n span{color:#7ab5d8}
.b-w{border:1.5px dashed #b58a3a99;background:#3a2a0a33}.b-w span{color:#d8b878}
.b-d{border:1.5px solid #6a4a9a99;background:#2a1a4a33}.b-d span{color:#b89ae0}
.has{border-color:#2faa6a!important;background:#1a6a3a44!important}.has span{color:#7aefaa!important}
.sel{border-color:#5ab0e8!important;background:#2a6aa055!important}.sel span{color:#bfe6ff!important}
.mark{position:absolute;font-size:9px;color:#4a8ab5;pointer-events:none}
#hint{text-align:center;padding:8px 12px;font-size:11px;color:#2a4a6a}
#hint .w{color:#d8b878}#hint .d{color:#8a6ac0}
#panel{position:fixed;right:0;top:0;bottom:0;width:300px;background:#081828;border-left:1px solid #1e3a5a;display:none;flex-direction:column;z-index:30;box-shadow:-6px 0 24px #0009}
#panel.open{display:flex}
.ph{padding:12px 14px;border-bottom:1px solid #1e3a5a;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pz{font-size:10px;color:#4a8ab5;letter-spacing:1px}
.pl{font-size:14px;font-weight:700;color:#c8dff0}
.x{background:none;border:none;color:#3a6a8a;font-size:20px;cursor:pointer;line-height:1}
#backBtn{background:none;border:1px solid #2a5a8a;border-radius:5px;color:#8ac0e8;font-size:14px;cursor:pointer;padding:3px 9px;display:none}
.pform{padding:10px 14px;border-bottom:1px solid #1e3a5a}
.pform .t{font-size:11px;color:#4a8ab5;margin-bottom:6px;font-weight:600}
input[type=text]{width:100%;background:#0c1e30;border:1px solid #1e4060;border-radius:5px;color:#c8dff0;padding:8px;font-size:13px;outline:none}
.row{display:flex;gap:6px;margin:6px 0;align-items:center;flex-wrap:wrap}
.row .q{width:52px}.row .u{width:58px}.row .n{flex:1}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:#d8b878;margin:6px 0;cursor:pointer;user-select:none}
.chk input{accent-color:#b58a3a;width:15px;height:15px}
.bp{flex:1;background:#1a4a7a;border:1px solid #2a6aa0;border-radius:5px;color:#8ac8f0;padding:8px 0;font-size:13px;cursor:pointer;font-weight:600}
.bs{background:transparent;border:1px solid #3a3a5a;border-radius:5px;color:#6a6a8a;padding:8px 10px;font-size:13px;cursor:pointer}
.pbtn{background:#102a40;border:1px solid #1e4060;border-radius:5px;color:#8ac0e8;padding:7px 10px;font-size:12px;cursor:pointer}
#photoPrev{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fp1{position:relative;display:inline-block}
.fp1 img{width:42px;height:42px;object-fit:cover;border-radius:5px;border:1px solid #2a5a8a;cursor:pointer;display:block}
.fp1 .rm{position:absolute;top:-7px;right:-7px;background:#3a1010;border:1px solid #7a3a3a;border-radius:50%;color:#e89090;font-size:10px;width:17px;height:17px;line-height:15px;text-align:center;cursor:pointer;padding:0}
#pitems{flex:1;overflow:auto;padding:8px 14px}
.it{background:#0c1e30;border:1px solid #1a3a5a;border-radius:6px;padding:7px 9px;margin-bottom:6px}
.itrow{display:flex;justify-content:space-between;align-items:flex-start}
.it.editing{background:#0e2a40;border-color:#2a6a9a}
.it.isbox{border-color:#7a5a2a;background:#1a1408}
.it.hl{border-color:#e8c850;box-shadow:0 0 0 1px #e8c850}
.it .nm{font-size:13px;color:#c0d8f0;font-weight:600}
.it.isbox .nm{color:#e8c890;cursor:pointer}
.it .meta{font-size:11px;color:#4a8ab5;margin-top:1px}
.it .meta b{color:#7aefaa;font-weight:600}
.it .meta i{color:#6a8a9a;font-style:normal;margin-left:8px}
.it .ops{display:flex;gap:20px;margin-left:10px;align-items:center}
.it .ops button{background:none;border:none;cursor:pointer;font-size:13px;padding:0}
.openb{background:#3a2a10!important;border:1px solid #7a5a2a!important;border-radius:5px;color:#e8c890!important;font-size:11px!important;padding:3px 8px!important}
.pe{color:#4a8ab5}.pd{color:#7a3a3a}.pm{color:#7aaa5a}.pg{color:#c8a850}
.thumbWrap{position:relative;margin-right:8px;flex-shrink:0;cursor:pointer}
.thumb{width:38px;height:38px;object-fit:cover;border-radius:4px;border:1px solid #2a5a8a;display:block}
.tcnt{position:absolute;bottom:-4px;right:-4px;background:#1a4a7a;border:1px solid #2a6aa0;border-radius:7px;font-size:9px;color:#bfe6ff;padding:0 4px;line-height:13px}
.mv{width:100%;margin-top:7px;background:#0c1e30;color:#c8dff0;border:1px solid #3a7a4a;border-radius:5px;padding:7px;font-size:12px;outline:none}
.mgp{margin-top:7px;background:#1a1610;border:1px solid #5a4a2a;border-radius:6px;padding:8px}
.mgp .mt{font-size:11px;color:#c8a850;margin-bottom:5px}
.mgrow{display:flex;align-items:center;gap:7px;font-size:12px;color:#b8c8d8;padding:4px 0;cursor:pointer}
.mgrow input{accent-color:#c8a850}
.pf{padding:8px 14px;border-top:1px solid #1e3a5a;font-size:11px;color:#3a6a8a}
#listView{display:none;padding:12px 16px;max-width:640px;margin:0 auto}
.zone{margin-bottom:16px}
.zh{font-size:12px;font-weight:700;color:#6aa8cc;border-bottom:1px solid #1e3a5a;padding-bottom:5px;margin-bottom:6px;letter-spacing:1px;display:flex;justify-content:space-between}
.zh .fl{font-size:10px;color:#3a6a8a;font-weight:400}
.lk{margin-bottom:5px}
.lkh{font-size:12px;display:flex;justify-content:space-between;margin-bottom:2px}
.lkh .lbl{color:#8ac0e8}.lkh .lbl.w{color:#d8b878}
.lkh button{background:none;border:none;color:#3a6a8a;cursor:pointer;font-size:12px}
.empty{font-size:11px;color:#2a4a6a;padding-left:12px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-left:12px}
td{padding:3px 6px;border-top:1px solid #0f2030}
.tn{color:#c0d8f0}.tn.bx{color:#e8c890}.tn.ch{padding-left:18px;color:#a8c0d8}
.tn .cam{cursor:pointer;margin-right:3px}
.tq{text-align:center;color:#7aefaa;width:44px}.tm{color:#7a98b0;font-size:11px}
.to{width:96px;white-space:nowrap;text-align:right}.to button{background:none;border:none;cursor:pointer;font-size:12px;margin-left:11px}
#trashView{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:55;padding:16px}
.trashBox{background:#0a1828;border:1px solid #2a5a8a;border-radius:12px;width:min(560px,100%);max-height:84vh;display:flex;flex-direction:column}
.trashHead{padding:13px 16px;border-bottom:1px solid #1e3a5a;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:700;color:#c8dff0}
#trashBody{padding:10px 14px;overflow:auto}
.trow{display:flex;align-items:center;gap:6px;background:#0c1e30;border:1px solid #1a3a5a;border-radius:7px;padding:8px 10px;margin-bottom:7px}
.trestore{background:#13351f;border:1px solid #2faa6a;border-radius:5px;color:#7aefaa;font-size:12px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.tdelp{background:none;border:1px solid #5a2a2a;border-radius:5px;color:#c87a7a;font-size:12px;padding:6px 10px;cursor:pointer;white-space:nowrap}
#photoView{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:60}
#photoView img{max-width:88vw;max-height:86vh;border-radius:6px}
.pvBtn{position:absolute;top:50%;transform:translateY(-50%);background:#ffffff14;border:1px solid #ffffff30;border-radius:50%;color:#fff;font-size:24px;width:44px;height:44px;cursor:pointer;line-height:1}
#pvPrev{left:10px}#pvNext{right:10px}
#pvCnt{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#ccc;font-size:13px;background:#0008;padding:3px 12px;border-radius:12px}
#pvClose{position:absolute;top:14px;right:14px;background:#ffffff14;border:1px solid #ffffff30;border-radius:50%;color:#fff;font-size:18px;width:38px;height:38px;cursor:pointer;line-height:1}
@media(max-width:700px){
  #panel{top:auto;left:0;right:0;bottom:0;width:100%;height:64vh;border-left:none;border-top:1px solid #2a5a8a;border-radius:14px 14px 0 0}
}

/* ===== First45 탭바/정기점검/수리목록 ===== */
body{padding-bottom:62px}
#tabbar{position:fixed;bottom:0;left:0;right:0;background:#081020;border-top:1px solid #1e3a5a;display:flex;z-index:60}
#tabbar button{flex:1;background:none;border:none;color:#4a789e;font-size:11px;padding:6px 0 9px;cursor:pointer}
#tabbar button.on{color:#9ed0f5}
#tabbar .ti{display:block;font-size:19px;margin-bottom:1px}
.mrhead{display:flex;gap:6px;align-items:center;padding:10px 14px 4px}
.mr{background:#0c1e30;border:1px solid #1e4060;border-radius:9px;margin:7px 14px;padding:9px 12px;cursor:pointer}
.mrt{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.mrn{font-size:14px;color:#c8dff0;font-weight:600;flex:1}
.mrs{font-size:12px;white-space:nowrap}
.mrm{font-size:11px;color:#4a789e;margin-top:3px;padding-left:18px}
.seedb{font-size:9px;color:#b58a3a;border:1px solid #7a5a20;border-radius:4px;padding:0 4px;vertical-align:1px}
.mrnone{color:#2a4a6a;font-size:12px;text-align:center;margin-top:22px}
#mrMap{position:relative;width:min(500px,100%);margin:0 auto}
.mpin{position:absolute;width:15px;height:15px;border-radius:50% 50% 50% 0;transform:translate(-50%,-100%) rotate(-45deg);border:2px solid #fff;cursor:pointer;box-shadow:0 1px 4px #000c}
#pinBanner{display:none;background:#3a2a08;border:1px solid #b58a3a;color:#e8c87a;font-size:12px;padding:8px 12px;text-align:center;border-radius:8px;margin:0 0 8px}
#mrPanel{position:fixed;left:0;right:0;bottom:62px;max-height:66vh;overflow:auto;background:#081828;border-top:2px solid #2a5a8a;border-radius:14px 14px 0 0;display:none;z-index:55;padding:14px 16px;box-shadow:0 -8px 30px #000b}
#mrPanel.open{display:block}
#mrPanel input,#mrPanel textarea,#mrPanel select{background:#0c1e30;border:1px solid #1e4060;border-radius:7px;color:#c8dff0;padding:7px 10px;font-size:13px;outline:none}
.mrrow{display:flex;gap:8px;margin:7px 0;align-items:center;flex-wrap:wrap}
.mrlbl{font-size:11px;color:#4a789e;width:58px;flex-shrink:0}
.mrbtn{background:#14304a;border:1px solid #2a5a8a;border-radius:7px;color:#9ed0f5;padding:7px 11px;font-size:12px;cursor:pointer}
.mrbtn.warn{border-color:#7a3030;color:#e08a8a}
.mrbtn.ok{border-color:#2a6a4a;color:#7aefaa}
.mrph{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mrph img{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid #2a5a8a}
.mhist{font-size:11px;color:#4a789e;margin:4px 0}
body.locked .edt{display:none!important}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a1628">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="선내적재표">

<body>
<header>
  <div class="hrow">
    <div>
      <div class="sub">First45 운용 · Beneteau First 45f5</div>
      <h1>선내 적재표 <span id="syncState" style="font-size:11px;font-weight:400;color:#4a8ab5"></span></h1>
    </div>
    <div class="btns">
      <button class="tab" id="lockBtn" onclick="toggleLock()">🔒 잠김</button>
      <button class="tab" id="tabToggle" onclick="toggleView()">📋 목록</button>
      <button class="tab" id="sortTab" onclick="cycleSort()">↕ 가나다순</button>
      <button class="tab" onclick="exportCSV()">⬇ CSV</button>
      <button class="tab" onclick="backupData()">💾 백업</button>
      <button class="tab" id="restoreBtn" onclick="document.getElementById('restoreFile').click()">📂 복원</button>
      <button class="tab" id="trashTab" onclick="openTrash()">🗑 휴지통</button>
      <input type="file" id="restoreFile" accept=".json,application/json" style="display:none" onchange="restoreData(event)">
    </div>
  </div>
  <div id="searchWrap">
    <input type="text" id="searchInput" placeholder="🔍 물품 검색 — 이름이나 비고로 어디 있는지 찾기" autocomplete="off">
    <div id="searchResults"></div>
  </div>
</header>

<div id="mapWrap">
  <div id="map">
    <img id="fp" alt="평면도">
    <div class="mark" style="top:-2px;left:50%;transform:translateX(-50%)">▲ 선수</div>
    <div class="mark" style="bottom:-15px;left:50%;transform:translateX(-50%)">선미 ▼</div>
    <div class="mark" style="left:-5px;top:48%;transform:rotate(-90deg)">좌현</div>
    <div class="mark" style="right:-5px;top:48%;transform:rotate(90deg)">우현</div>
    <div class="mark" style="left:50%;top:82%;transform:translateX(-50%);color:#6a4a9a;letter-spacing:2px;font-size:8px">── 2층 (갑판) ──</div>
  </div>
</div>
<div id="hint">칸 클릭 · 초록=물품있음 · <span class="w">점선=벽면/선반</span> · <span class="d">보라=2층</span> · 📦 상자 · ↪ 이동 · 🔗 합치기 · 📷 사진 여러 장</div>

<div id="listView"></div>
<div id="maintWrap" style="display:none">
  <div class="mrhead">
    <button class="tab" id="maintViewBtn" onclick="mrToggleView('maint')">🗺 도면</button>
    <span style="flex:1"></span>
    <button class="tab edt" onclick="mrAdd('maint')">＋ 항목추가</button>
  </div>
  <div id="maintList"></div>
</div>
<div id="repairWrap" style="display:none">
  <div class="mrhead">
    <button class="tab" id="repairViewBtn" onclick="mrToggleView('repair')">🗺 도면</button>
    <span style="flex:1"></span>
    <button class="tab edt" onclick="mrAdd('repair')">＋ 등록</button>
  </div>
  <div id="repairList"></div>
</div>
<div id="mrMapWrap" style="display:none;padding:6px 14px 10px">
  <div style="display:flex;gap:6px;justify-content:center;margin-bottom:8px">
    <button class="tab" id="kindSide" onclick="setMapKind('side')">측면도</button>
    <button class="tab" id="kindPlan" onclick="setMapKind('plan')">평면도</button>
  </div>
  <div id="pinBanner">📍 도면을 탭해서 핀 위치를 지정해라
    <button class="mrbtn" style="margin-left:8px" onclick="pinCancel()">취소</button></div>
  <div id="mrMap" onclick="mrMapClick(event)"></div>
</div>
<div id="mrPanel"></div>
<input type="file" id="mrCam" accept="image/*" capture="environment" style="display:none" onchange="mrPickPhoto(event)">
<input type="file" id="mrFile" accept="image/*" multiple style="display:none" onchange="mrPickPhoto(event)">
<nav id="tabbar">
  <button id="tabStow" class="on" onclick="switchTab('stow')"><span class="ti">📦</span>적재표</button>
  <button id="tabMaint" onclick="switchTab('maint')"><span class="ti">🔧</span>정기점검</button>
  <button id="tabRepair" onclick="switchTab('repair')"><span class="ti">⚠️</span>수리목록</button>
</nav>


<div id="panel">
  <div class="ph">
    <button id="backBtn" onclick="goBack()">←</button>
    <div style="flex:1"><div class="pz" id="pz"></div><div class="pl" id="pl"></div></div>
    <button class="x" onclick="closePanel()">×</button>
  </div>
  <div class="pform">
    <div class="t" id="formTitle">물품 추가</div>
    <input type="text" id="fName" placeholder="물품명" autocomplete="off">
    <div class="row">
      <input type="text" id="fQty" class="q" placeholder="수량" value="1" autocomplete="off">
      <input type="text" id="fUnit" class="u" placeholder="단위" list="unitList" autocomplete="off">
      <datalist id="unitList"><option value="개"><option value="통"><option value="벌"><option value="짝"><option value="켤레"><option value="장"><option value="묶음"><option value="세트"><option value="L"><option value="mL"><option value="m"><option value="롤"><option value="병"><option value="권"></datalist>
      <input type="text" id="fNote" class="n" placeholder="비고" autocomplete="off">
    </div>
    <div class="row">
      <button class="pbtn" onclick="document.getElementById('photoCam').click()">📷 촬영</button>
      <button class="pbtn" onclick="document.getElementById('photoFile').click()">🖼 앨범</button>
      <div id="photoPrev"></div>
      <input type="file" id="photoCam" accept="image/*" capture="environment" style="display:none" onchange="pickPhoto(event)">
      <input type="file" id="photoFile" accept="image/*" multiple style="display:none" onchange="pickPhoto(event)">
    </div>
    <label class="chk" id="boxChkWrap"><input type="checkbox" id="fBox"> 📦 상자/공구함 (안에 물품 추가 가능)</label>
    <div class="row">
      <button class="bp" id="addBtn" onclick="addItem()">+ 추가</button>
      <button class="bs" id="cancelBtn" onclick="cancelEdit()" style="display:none">취소</button>
    </div>
  </div>
  <div id="pitems"></div>
  <div class="pf" id="pf"></div>
</div>

<div id="trashView">
  <div class="trashBox">
    <div class="trashHead"><span>🗑 삭제된 물품</span><button class="x" onclick="closeTrash()">×</button></div>
    <div id="trashBody"></div>

function migrate(arr){
  return (arr||[]).map(i=>{
    const o = {box:false, parentId:null, unit:'', ...i};
    o.photos = Array.isArray(i.photos) ? i.photos : (i.photo ? [i.photo] : []);
    o.unit = i.unit || '';
    delete o.photo;
    return o;
  });
}

// ===== 저장소: IndexedDB(대용량) / 실패 시 localStorage 폴백 =====
let db = null;
function openDB(){
  return new Promise((res,rej)=>{
    const q = indexedDB.open('yacht_stowage', 1);
    q.onupgradeneeded = ()=>{ q.result.createObjectStore('kv'); };
    q.onsuccess = ()=>res(q.result);
    q.onerror = ()=>rej(q.error);
  });
}
function idbGet(key){ return new Promise((res,rej)=>{ const t=db.transaction('kv','readonly').objectStore('kv').get(key); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }
function idbSet(key,val){ return new Promise((res,rej)=>{ const t=db.transaction('kv','readwrite').objectStore('kv').put(val,key); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }

async function initStorage(){
  try{
    db = await openDB();
    let data = await idbGet('all');
    if(!data || !data.length){
      try{
        const old = JSON.parse(localStorage.getItem('yacht_stowage_items')||'[]');
        if(old.length){ data = old; await idbSet('all', data); }
      }catch(e){}
    }
    items = migrate(data);
    try{ trash = migrate(await idbGet('trash')); }catch(e){ trash = []; }
    try{ const m = await idbGet('maint'); maint = (m&&m.length)? m : deepCopy(MAINT_DEFAULTS); }catch(e){ maint = deepCopy(MAINT_DEFAULTS); }
    try{ const r = await idbGet('repair'); repair = r||[]; }catch(e){ repair = []; }
    updateTrashTab();
  }catch(e){
    db = null;
    try{ items = migrate(JSON.parse(localStorage.getItem('yacht_stowage_items')||'[]')); }catch(_){ items=[]; }
    try{ trash = migrate(JSON.parse(localStorage.getItem('yacht_stowage_trash')||'[]')); }catch(_){ trash=[]; }
    try{ const m = JSON.parse(localStorage.getItem('f45_maint')||'[]'); maint = m.length? m : deepCopy(MAINT_DEFAULTS); }catch(_){ maint = deepCopy(MAINT_DEFAULTS); }
    try{ repair = JSON.parse(localStorage.getItem('f45_repair')||'[]'); }catch(_){ repair=[]; }
  }
  refreshBoxes(); renderList();
}

function saveLocal(){
  if(db){
    idbSet('all', items).catch(e=>alert('저장 실패: 기기 저장공간 부족일 수 있다. 백업을 먼저 해라.'));
    idbSet('trash', trash).catch(e=>{});
    idbSet('maint', maint).catch(e=>{});
    idbSet('repair', repair).catch(e=>{});
  } else {
    try{
      localStorage.setItem('yacht_stowage_items', JSON.stringify(items));
      localStorage.setItem('yacht_stowage_trash', JSON.stringify(trash));
      localStorage.setItem('f45_maint', JSON.stringify(maint));
      localStorage.setItem('f45_repair', JSON.stringify(repair));
    }
    catch(e){ alert('저장공간이 가득 찼다(기본 모드 5MB 제한). 사진을 줄이거나 백업 후 정리해라.'); }
  }
}

const EDIT_PW_HASH = 'ead595aca2c885235eead796972e0c3a94f8b3e45aa0fb916638f0a8fe6d292c';
let unlocked = localStorage.getItem('f45_unlocked')==='1';
async function sha256hex(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
function applyLock(){
  document.body.classList.toggle('locked', !unlocked);
  const b = document.getElementById('lockBtn');
  b.textContent = unlocked ? '🔓 수정중' : '🔒 잠김';
  b.classList.toggle('unlocked', unlocked);
}
async function toggleLock(){
  if(unlocked){
    unlocked = false; localStorage.removeItem('f45_unlocked'); applyLock();
  } else {
    const pw = prompt('수정 비밀번호:');
    if(pw==null) return;
    let h='';
    try{ h = await sha256hex(pw); }catch(e){ alert('이 브라우저에서는 잠금 해제가 안 된다(보안 컨텍스트 필요). https 주소로 열어라.'); return; }
    if(h===EDIT_PW_HASH){
      unlocked = true; localStorage.setItem('f45_unlocked','1'); applyLock();
      cloudSeedCheck();
    } else alert('비밀번호가 틀렸다.');
  }
}

// ===== 클라우드 동기화 (Firestore) =====
let cloud = null, lastCloud = {}, lastCloudTrash = {}, lastCloudMaint = {}, lastCloudRepair = {}, pushTimer = null;
let storageReadyResolve; const storageReady = new Promise(r=>storageReadyResolve=r);
function setSync(t){ const el=document.getElementById('syncState'); if(el) el.textContent = t; }
const snapOf = arr => { const m={}; arr.forEach(i=>{ m[String(i.id)] = JSON.stringify(i); }); return m; };

window.__initCloud = async function(api){
  cloud = api;
  await storageReady;
  setSync('☁ 연결 중…');
  try{ await cloudPull(); }
  catch(e){ setSync('📴 오프라인 · 로컬 데이터'); }
  window.addEventListener('online', ()=>{ if(cloud) cloudPull().catch(()=>{}); });
};
window.__cloudFailed = async function(){
  await storageReady;
  setSync('📴 오프라인 · 로컬 데이터');
};

async function cloudPull(){
  const r = await cloud.pull();
  if(Array.isArray(r.maint) && r.maint.length) maint = r.maint;
  if(Array.isArray(r.repair) && r.repair.length) repair = r.repair;
  lastCloudMaint = snapOf(Array.isArray(r.maint)? r.maint : []);
  lastCloudRepair = snapOf(Array.isArray(r.repair)? r.repair : []);
  if(r.seeded){
    items = migrate(r.items); trash = migrate(r.trash);
    lastCloud = snapOf(items); lastCloudTrash = snapOf(trash);
    saveLocal();
    inBox=null; moveId=null; mergeId=null; editId=null;
    if(selected){ updateHeader(); renderPanelItems(); }
    refreshBoxes(); renderList(); updateTrashTab();
    setSync('☁ 동기화됨');
    // 정기점검 시드가 클라우드에 없으면 (수정 권한 있을 때) 조용히 올림
    if(unlocked && maint.length && Object.keys(lastCloudMaint).length===0) schedulePush();
  } else {
    lastCloud = {}; lastCloudTrash = {};
    setSync('☁ 클라우드 비어있음');
    cloudSeedCheck();
  }
  if(curTab==='maint' || curTab==='repair') renderMR();
}
function cloudSeedCheck(){
  if(cloud && unlocked && items.length && Object.keys(lastCloud).length===0){
    if(confirm(`클라우드가 비어있다. 이 기기의 물품 ${items.length}개를 클라우드에 올릴까?`)) schedulePush();
  }
}
function schedulePush(){
  if(!cloud || !unlocked) return;
  setSync('⏳ 클라우드 저장 중…');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushNow, 1200);
}
async function pushNow(){
  if(!cloud || !unlocked) return;
  try{
    const curI = snapOf(items), curT = snapOf(trash), curM = snapOf(maint), curR = snapOf(repair);
    const diff = (cur, last)=>{
      const set=[], del=[];
      for(const k in cur) if(last[k]!==cur[k]) set.push(JSON.parse(cur[k]));
      for(const k in last) if(!(k in cur)) del.push(k);
      return [set, del];
    };
    const [setI,delI] = diff(curI, lastCloud);
    const [setT,delT] = diff(curT, lastCloudTrash);
    const [setM,delM] = diff(curM, lastCloudMaint);
    const [setR,delR] = diff(curR, lastCloudRepair);
    if(setI.length||delI.length||setT.length||delT.length||setM.length||delM.length||setR.length||delR.length){
      await cloud.push({setI, delI, setT, delT, setM, delM, setR, delR,
                        itemCount:items.length, trashCount:trash.length,
                        maintCount:maint.length, repairCount:repair.length});
    }
    lastCloud = curI; lastCloudTrash = curT; lastCloudMaint = curM; lastCloudRepair = curR;
    setSync('☁ 동기화됨');
  }catch(e){
    console.error(e);
    setSync('⚠ 동기화 실패 · 로컬엔 저장됨');
  }
}

function pickPhoto(ev){
  const files = Array.from(ev.target.files||[]); ev.target.value='';
  files.forEach(f=>{
    const img = new Image();
    img.onload = ()=>{
      const max = 320; let w = img.width, h = img.height;
      const sc = Math.min(1, max/Math.max(w,h)); w = Math.round(w*sc); h = Math.round(h*sc);
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      formPhotos.push(c.toDataURL('image/jpeg', 0.5));
      URL.revokeObjectURL(img.src);
      renderPhotoPreview();
    };
    img.onerror = ()=>{ alert('사진을 읽을 수 없다'); };
    img.src = URL.createObjectURL(f);
  });
}

    ? formPhotos.map((ph,i)=>`<span class="fp1"><img src="${ph}" onclick="pvOpen(formPhotos,${i})"><button class="rm" onclick="formPhotos.splice(${i},1);renderPhotoPreview()">✕</button></span>`).join('')

}

function cancelEdit(){ editId=null; resetForm(); renderPanelItems(); }
function deleteItem(id){
  const it = getItem(id); if(!it) return;
  const ch = it.box ? children(id) : [];
  const dead = new Set([id, ...ch.map(c=>c.id)]);
  const removed = items.filter(i=>dead.has(i.id)).map(i=>({...i, _delAt:Date.now()}));
  trash = removed.concat(trash);
  items = items.filter(i=>!dead.has(i.id));
  if(editId!==null && dead.has(editId)){ editId=null; resetForm(); }
  if(inBox && dead.has(inBox)){ inBox=null; updateHeader(); resetForm(); }
  if(moveId!==null && dead.has(moveId)) moveId=null;
  if(mergeId!==null && dead.has(mergeId)) mergeId=null;
  save(); renderPanelItems(); refreshBoxes(); renderList(); updateTrashTab();
}

    }).join('') + (trash.length>1?`<button class="bs" style="width:100%;margin-top:10px;border-color:#7a3a3a;color:#c87a7a" onclick="purgeAll()">휴지통 비우기 (전체 완전삭제)</button>`:'');

function restoreItem(id){
  const idx = trash.findIndex(i=>i.id===id); if(idx<0) return;
  const it = trash[idx];
  const restoreSet = [it];
  if(it.box){ trash.filter(x=>x.parentId===id).forEach(c=>restoreSet.push(c)); }
  if(it.parentId && !getItem(it.parentId) && !trash.find(x=>x.id===it.parentId)){
    it.parentId = null;
  }
  const ids = new Set(restoreSet.map(x=>x.id));
  restoreSet.forEach(x=>{ const o={...x}; delete o._delAt; items.push(o); });
  trash = trash.filter(x=>!ids.has(x.id));
  save(); refreshBoxes(); renderList(); updateTrashTab(); openTrash();
}
function purgeItem(id){
  const it = trash.find(i=>i.id===id); if(!it) return;
  if(!confirm(`"${it.name}"을(를) 완전히 삭제한다. 복구할 수 없다. 진행할까?`)) return;
  const dead = new Set([id, ...trash.filter(x=>x.parentId===id).map(x=>x.id)]);
  trash = trash.filter(i=>!dead.has(i.id));
  save(); updateTrashTab(); openTrash();
}
function purgeAll(){
  if(!confirm(`휴지통의 ${trash.length}개 항목을 전부 완전 삭제한다. 복구할 수 없다. 진행할까?`)) return;
  trash = [];
  save(); updateTrashTab(); openTrash();
}

function renderMoveSub(zone, itemId){
  const wrap = document.getElementById('mvSubWrap_'+itemId);
  if(!wrap) return;
  if(!zone){ wrap.innerHTML=''; return; }
  const it = getItem(itemId); if(!it) return;
  let h = '<option value="">📍 칸 선택…</option>';
  LOCKERS.filter(l=>l.zone===zone).forEach(l=>{
    const cur = !it.parentId && it.lockerId===l.id;
    h += `<option value="L:${l.id}"${cur?' disabled':''}>${l.label}${cur?' (현재 위치)':''}</option>`;
    if(!it.box){
      items.filter(b=>b.box && b.lockerId===l.id).forEach(b=>{
        const curB = it.parentId===b.id;
        h += `<option value="B:${b.id}"${curB?' disabled':''}>${l.label} › 📦 ${esc(b.name)}${curB?' (현재 위치)':''}</option>`;
      });
    }
  });
  wrap.innerHTML = `<select class="mv" onchange="doMove(this.value)">${h}</select>`;
}
function doMove(val){
  if(!val || moveId===null) return;
  const it = getItem(moveId); if(!it){ moveId=null; return; }
  let lockerId, parentId = null;
  if(val.startsWith('B:')){
    const b = getItem(parseFloat(val.slice(2)));
    if(!b){ moveId=null; renderPanelItems(); return; }
    lockerId = b.lockerId; parentId = b.id;
  } else {
    lockerId = val.slice(2);
  }
  const l = getLocker(lockerId); if(!l){ moveId=null; return; }
  const movedBox = it.box;
  items = items.map(i=>{
    if(i.id===it.id) return {...i, lockerId, zone:l.zone, locker:l.label, parentId};
    if(movedBox && i.parentId===it.id) return {...i, lockerId, zone:l.zone, locker:l.label};
    return i;
  });
  moveId = null;
  save(); renderPanelItems(); refreshBoxes(); renderList();
}

function toggleMerge(id){ mergeId = (mergeId===id ? null : id); moveId=null; renderPanelItems(); }
function mergePanelHTML(it){
  const same = items.filter(o=>o.id!==it.id && !o.box && norm(o.name)===norm(it.name));
  if(!same.length) return `<div class="mgp"><div class="mt">다른 위치에 같은 이름("${esc(it.name)}") 물품이 없다</div></div>`;
  return `<div class="mgp"><div class="mt">🔗 같은 이름 ${same.length}개 발견 — 체크된 것을 <b>이곳으로</b> 합친다 (수량 합산·사진 통합)</div>` +
    same.map(o=>`<label class="mgrow"><input type="checkbox" checked data-mid="${o.id}"><span>📍 ${esc(locPath(o))} · ×${esc(o.qty)}${esc(o.unit||'')}${o.photos.length?` · 📷${o.photos.length}`:''}</span></label>`).join('') +
    `<button class="bp" style="margin-top:7px;width:100%" onclick="doMerge(${it.id})">선택 항목 합치기</button></div>`;
}
function doMerge(targetId){
  const t = getItem(targetId); if(!t){ mergeId=null; return; }
  const checks = Array.from(document.querySelectorAll('.mgp input[type=checkbox]:checked')).map(c=>parseFloat(c.dataset.mid));
  const srcs = checks.map(getItem).filter(Boolean);
  if(!srcs.length){ mergeId=null; renderPanelItems(); return; }
  let total = parseFloat(t.qty), numeric = !isNaN(total);
  srcs.forEach(s=>{ const n = parseFloat(s.qty); if(isNaN(n)) numeric=false; else total+=n; });
  const units = new Set([t.unit||'', ...srcs.map(s=>s.unit||'')]);
  const sameUnit = units.size===1;
  const qty = (numeric && sameUnit) ? String(total) : [t.qty+(t.unit||''), ...srcs.map(s=>s.qty+(s.unit||''))].join('+');
  const unit = (numeric && sameUnit) ? (t.unit||'') : '';
  const photos = t.photos.slice(); srcs.forEach(s=>photos.push(...(s.photos||[])));
  const notes = [t.note, ...srcs.map(s=>s.note)].filter(x=>x && x.trim());
  const note = Array.from(new Set(notes)).join(' / ');
  const dead = new Set(srcs.map(s=>s.id));
  items = items.map(i=>i.id===targetId?{...i,qty,unit,photos,note}:i).filter(i=>!dead.has(i.id));
  mergeId = null;
  save(); renderPanelItems(); refreshBoxes(); renderList();
  alert(`합침 완료: ${srcs.length}곳 → ${t.name} (수량 ${qty}${unit}, 사진 ${photos.length}장)`);
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function sortItems(list){
  const arr = list.slice();
  const byName = (a,b)=>String(a.name).localeCompare(String(b.name),'ko');
  if(sortMode==='name'){
    arr.sort((a,b)=> (b.box?1:0)-(a.box?1:0) || byName(a,b));
  } else if(sortMode==='added'){
    arr.sort((a,b)=> b.id - a.id);
  } else if(sortMode==='photo'){
    arr.sort((a,b)=> ((b.photos&&b.photos.length?1:0)-(a.photos&&a.photos.length?1:0)) || byName(a,b));
  } else if(sortMode==='box'){
    arr.sort((a,b)=> (b.box?1:0)-(a.box?1:0) || byName(a,b));
  } else if(sortMode==='qty'){
    arr.sort((a,b)=>{ const na=parseFloat(a.qty), nb=parseFloat(b.qty); const va=isNaN(na)?-1:na, vb=isNaN(nb)?-1:nb; return vb-va || byName(a,b); });
  }
  return arr;
}
function cycleSort(){
  const i = SORT_MODES.findIndex(m=>m[0]===sortMode);
  sortMode = SORT_MODES[(i+1)%SORT_MODES.length][0];
  document.getElementById('sortTab').textContent = SORT_MODES.find(m=>m[0]===sortMode)[1];
  renderPanelItems(); renderList();
}

}

function rowHTML(it, isChild){
  const cls = it.box ? 'tn bx' : isChild ? 'tn ch' : 'tn';

function renderList(){
  const v = document.getElementById('listView');
  v.innerHTML = ZONE_ORDER.map(zone=>{

    return `<div class="zone"><div class="zh"><span>${zone}</span><span class="fl">${locs[0]&&locs[0].deck2?'2층':'1층'}</span></div>` +
      locs.map(l=>{
        const top = sortItems(items.filter(i=>i.lockerId===l.id && !i.parentId));

        top.forEach(it=>{
          rows += rowHTML(it, false);

function exportCSV(){
  const rows = [["층","구역","수납칸","상자","물품명","수량","단위","비고"]];
  ZONE_ORDER.forEach(zone=>{
    LOCKERS.filter(l=>l.zone===zone).forEach(l=>{
      const top = items.filter(i=>i.lockerId===l.id && !i.parentId);
      if(top.length===0){ rows.push([l.deck2?"2층":"1층", zone, l.label, "", "", "", "", ""]); return; }
      top.forEach(it=>{
        rows.push([l.deck2?"2층":"1층", zone, l.label, it.box?"(상자)":"", it.name, it.qty, it.unit||"", it.note]);
        if(it.box) children(it.id).forEach(c=>{
          rows.push([l.deck2?"2층":"1층", zone, l.label, it.name, c.name, c.qty, c.unit||"", c.note]);
        });
      });
    });
  });
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "yacht_stowage.csv"; a.click();
  URL.revokeObjectURL(a.href);
}

function backupData(){

  const blob = new Blob([JSON.stringify(data)], {type:"application/json"});

  const d = new Date(), pad = n=>String(n).padStart(2,'0');
  a.href = URL.createObjectURL(blob);
  a.download = `적재표백업_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;

function restoreData(ev){
  const f = ev.target.files[0]; ev.target.value='';
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const data = JSON.parse(r.result);
      const arr = Array.isArray(data) ? data : data.items;
      if(!Array.isArray(arr)) throw new Error('형식이 다른 파일');
      const valid = arr.filter(i=>i && i.lockerId && i.name && getLocker(i.lockerId));
      if(!confirm(`백업에서 ${valid.length}개 물품을 불러온다. 현재 목록(${items.length}개)은 교체된다. 진행할까?`)) return;
      const ids = new Set(valid.map(i=>i.id));
      items = migrate(valid).map(i=>({
        ...i,
        id: i.id||(Date.now()+Math.random()),
        parentId: (i.parentId && ids.has(i.parentId)) ? i.parentId : null
      }));
      if(Array.isArray(data.trash)) trash = migrate(data.trash);
      if(Array.isArray(data.maint) && data.maint.length) maint = data.maint;
      if(Array.isArray(data.repair)) repair = data.repair;
      save(); inBox=null; moveId=null; mergeId=null;
      if(selected){ updateHeader(); renderPanelItems(); }
      refreshBoxes(); renderList(); updateTrashTab();
      alert('복원 완료: '+items.length+'개 물품'+(trash.length?` (휴지통 ${trash.length}개)`:''));
    }catch(e){ alert('백업 파일을 읽을 수 없다: '+e.message); }
  };
  r.readAsText(f);
}

const deepCopy = o => JSON.parse(JSON.stringify(o));
function addMonths(iso, m){
  const [y,mo,d] = iso.split('-').map(Number);
  const nd = new Date(y, mo-1+(m||12), 1);
  const lastDay = new Date(nd.getFullYear(), nd.getMonth()+1, 0).getDate();
  nd.setDate(Math.min(d, lastDay));
  return nd;
}
function fmtDate(d){ const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
const today = () => fmtDate(new Date());
function mStatus(it){
  if(!it.lastDate) return {c:'#8a97a8', t:'미기록', next:null, days:null};
  const nd = addMonths(it.lastDate, it.months);
  const days = Math.floor((nd - new Date())/864e5);
  if(days<0)   return {c:'#e05a5a', t:'지남 '+(-days)+'일', next:nd, days};
  if(days<=30) return {c:'#e0b74a', t:'남음 '+days+'일',  next:nd, days};
  return {c:'#57c785', t:'남음 '+days+'일', next:nd, days};
}

function mrPickPhoto(ev){
  const files = Array.from(ev.target.files||[]); ev.target.value='';
  const it=getMR(mrOpenType,mrOpenId); if(!it) return;
  files.forEach(f=>{
    const img = new Image();
    img.onload = ()=>{
      const max=320; let w=img.width,h=img.height;
      const sc=Math.min(1,max/Math.max(w,h)); w=Math.round(w*sc); h=Math.round(h*sc);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      it.photos = it.photos||[];
      it.photos.push(c.toDataURL('image/jpeg',0.5));
      URL.revokeObjectURL(img.src);
      saveMR(); openMR(mrOpenType,mrOpenId);
    };
    img.onerror = ()=>alert('사진을 읽을 수 없다');
    img.src = URL.createObjectURL(f);
  });
}

  if(!unlocked){ alert('읽기 전용 모드다.'); return; }
  pinTarget = {type:mrOpenType, id:mrOpenId};
  closeMR();
  if(curTab==='maint') maintView='map'; else repairView='map';
  renderMR();
  document.getElementById('pinBanner').style.display='block';
}
function pinCancel(){ pinTarget=null; const b=document.getElementById('pinBanner'); if(b) b.style.display='none'; }
function pinRemove(){
  const it=getMR(mrOpenType,mrOpenId); if(!it) return;
  it.pin=null; saveMR(); openMR(mrOpenType,mrOpenId);
}
function pinShow(){
  const it=getMR(mrOpenType,mrOpenId); if(!it||!it.pin) return;
  mrMapKind = it.pin.map;
  if(curTab==='maint') maintView='map'; else repairView='map';
  closeMR(); renderMR();
}
function mrMapClick(e){
  if(!pinTarget) return;
  const img = document.querySelector('#mrMap img'); if(!img) return;
  const r = img.getBoundingClientRect();
  const x = Math.round((e.clientX-r.left)/r.width*1000)/10;
  const y = Math.round((e.clientY-r.top)/r.height*1000)/10;
  if(x<0||x>100||y<0||y>100) return;
  const it = getMR(pinTarget.type, pinTarget.id); if(!it){ pinCancel(); return; }
  it.pin = {map:mrMapKind, x, y};
  const t=pinTarget.type, id=pinTarget.id;
  pinCancel(); saveMR(); setMapKind(mrMapKind);
  openMR(t,id);
}

applyLock();
initStorage().then(()=>storageReadyResolve());
</script>
<script type="module">
(async ()=>{
  try{
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const { getFirestore, collection, getDocs, getDoc, doc, writeBatch } =
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const firebaseConfig = {
      apiKey: "AIzaSyDxkqobNgFrC9WiHSBzEr8yIpRZbFrv4JU",
      authDomain: "yacht-stowage.firebaseapp.com",
      projectId: "yacht-stowage",
      storageBucket: "yacht-stowage.firebasestorage.app",
      messagingSenderId: "125305863225",
      appId: "1:125305863225:web:104a404fb813b7175161e8"
    };
    const fapp = initializeApp(firebaseConfig);
    const fdb = getFirestore(fapp);
    const api = {
      async pull(){
        const meta = await getDoc(doc(fdb,'meta','info'));
        const isnap = await getDocs(collection(fdb,'items'));
        const tsnap = await getDocs(collection(fdb,'trash'));
        const msnap = await getDocs(collection(fdb,'maint'));
        const rsnap = await getDocs(collection(fdb,'repair'));
        return {
          seeded: meta.exists(),
          items: isnap.docs.map(d=>d.data()),
          trash: tsnap.docs.map(d=>d.data()),
          maint: msnap.docs.map(d=>d.data()),
          repair: rsnap.docs.map(d=>d.data())
        };
      },
      async push(p){
        const ops = [];
        p.setI.forEach(i=>ops.push(['set','items',String(i.id),i]));
        p.delI.forEach(k=>ops.push(['del','items',k]));
        p.setT.forEach(i=>ops.push(['set','trash',String(i.id),i]));
        p.delT.forEach(k=>ops.push(['del','trash',k]));
        p.setM.forEach(i=>ops.push(['set','maint',String(i.id),i]));
        p.delM.forEach(k=>ops.push(['del','maint',k]));
        p.setR.forEach(i=>ops.push(['set','repair',String(i.id),i]));
        p.delR.forEach(k=>ops.push(['del','repair',k]));
        ops.push(['set','meta','info',{updatedAt:new Date().toISOString(),
          itemCount:p.itemCount, trashCount:p.trashCount,
          maintCount:p.maintCount, repairCount:p.repairCount}]);
        for(let off=0; off<ops.length; off+=200){
          const b = writeBatch(fdb);
          ops.slice(off, off+200).forEach(o=>{
            const r = doc(fdb, o[1], o[2]);
            if(o[0]==='set') b.set(r, o[3]); else b.delete(r);
          });
          await b.commit();
        }
      }
    };
    window.__initCloud(api);
  }catch(e){
    console.error('cloud init failed', e);
    if(window.__cloudFailed) window.__cloudFailed();
  }
})();
</script>

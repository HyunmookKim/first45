name: collect-tide
on:
  schedule:
    - cron: '0 19 * * *'   # 매일 04:00 KST (서버 한산한 새벽)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tide:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/collect_tide.js
      - name: commit tide.json
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tide.json tide-spots.json
          git diff --cached --quiet && exit 0
          git commit -m "물때 자동 수집"
          git pull --rebase origin main
          git push

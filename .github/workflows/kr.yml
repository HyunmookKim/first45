name: collect-kr
on:
  schedule:
    - cron: '30 21 * * *'   # 매일 06:30 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install rss-parser@3
      - run: node scripts/collect_kr.js
      - name: commit kr.json
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add kr.json
          git diff --cached --quiet || git commit -m "한국 해양 소식·특보 수집"
          git push

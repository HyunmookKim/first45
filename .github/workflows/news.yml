name: collect-news
on:
  schedule:
    - cron: '0 21 */3 * *'   # 3일마다 06:00 KST
  workflow_dispatch:          # Actions 탭에서 수동 실행 버튼
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install rss-parser@3
      - run: node scripts/collect_news.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: commit news.json
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "요트 뉴스 자동 수집"
          git push
